server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirect chain the crawler must follow and canonicalize:
    # /redirect/a -> /redirect/b -> /js/array-map.html
    location = /redirect/a { return 301 /redirect/b; }
    location = /redirect/b { return 301 /js/array-map.html; }

    # A redirect loop that must be detected and abandoned
    location = /loop/x { return 301 /loop/y; }
    location = /loop/y { return 301 /loop/x; }

    location / {
        try_files $uri $uri/ =404;
    }
}
